# =============================================================
# nginx.conf — Frontend container web server config
# =============================================================
# nginx does two jobs here:
#
#  1. SERVE — static React files (HTML, JS, CSS built by Vite)
#  2. PROXY — any request to /api/* is forwarded to the backend
#             container. This eliminates CORS completely because
#             from the browser's perspective everything is on the
#             same origin (localhost:3000).
# =============================================================

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip compression ────────────────────────────────────
    # Makes JS/CSS files smaller over the network
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # ─── React SPA routing ───────────────────────────────────
    # React Router handles URLs like /admin/dashboard/students
    # but those paths don't exist as real files.
    # try_files checks: does the file exist? does the folder exist?
    # If neither, serve index.html and let React Router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API proxy ───────────────────────────────────────────
    # Browser requests to /api/... are forwarded to the backend
    # container (named "backend" in docker-compose — Docker's
    # built-in DNS resolves the container name automatically).
    location /api {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;

        # Pass the original Host header so backend knows the origin
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Uploaded files proxy ────────────────────────────────
    # Profile pictures / resume files served from backend's
    # /uploads endpoint are also proxied through nginx.
    location /uploads {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ─── Static asset caching ────────────────────────────────
    # Vite hashes filenames (main.a3f9bc.js) so they're safe to
    # cache for a very long time. Browser won't re-download them.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
